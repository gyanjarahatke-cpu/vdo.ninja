<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<title>MCast Studio Guest Invite</title>
		<style>
			html,
			body {
				min-height: 100%;
				margin: 0;
				background: #111315;
				color: #eef2f7;
				font: 600 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			body {
				display: grid;
				place-items: center;
				padding: 24px;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<p>Loading invite...</p>
		<script>
			(function () {
				"use strict";

				var path = window.location.pathname || "";
				var match = path.match(/^\/(?:g|m|c|s|w|p|i)\/([A-Za-z0-9]{6,16})\/?$/i);
				if (!match) {
					window.location.replace("/g/");
					return;
				}

				fetch("/g/?mcastFallback=" + Date.now(), { cache: "no-store" })
					.then(function (response) {
						if (!response.ok) {
							throw new Error("Guest app load failed.");
						}
						return response.text();
					})
					.then(function (html) {
						document.open();
						document.write(html);
						document.close();
					})
					.catch(function () {
						window.location.replace("/g/?s=" + encodeURIComponent(match[1]));
					});
			})();
		</script>
	</body>
</html>
