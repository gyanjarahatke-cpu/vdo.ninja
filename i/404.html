<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<title>MCast Studio Guest Invite</title>
		<style>html,body{min-height:100%;margin:0;background:#111315;color:#eef2f7;font:600 15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px;text-align:center}</style>
	</head>
	<body>
		<p>Loading invite...</p>
		<script>
			fetch("/mcast-guest.html?v=2", { cache: "no-store" })
				.then(function (response) {
					if (!response.ok) throw new Error("load failed");
					return response.text();
				})
				.then(function (html) {
					document.open();
					document.write(html);
					document.close();
				})
				.catch(function () {
					document.body.textContent = "This MCast Studio invite could not be loaded.";
				});
		</script>
	</body>
</html>
