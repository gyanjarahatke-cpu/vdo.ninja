<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<title>MCast Studio Guest Invite</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #0a0d12;
				color: #eef2f7;
			}

			html,
			body {
				min-height: 100%;
				margin: 0;
				background: #0a0d12;
			}

			body {
				display: grid;
				place-items: center;
				padding: 24px;
				text-align: center;
			}

			.panel {
				display: grid;
				gap: 14px;
				width: min(420px, 100%);
			}

			.mark {
				width: 48px;
				height: 48px;
				margin: 0 auto;
				border-radius: 8px;
				background: #fff url("/media/mcast-apple-touch-icon.png") center / cover no-repeat;
			}

			h1 {
				margin: 0;
				font-size: 22px;
				line-height: 1.2;
				font-weight: 780;
				letter-spacing: 0;
			}

			p {
				margin: 0;
				color: #9ca8ba;
				font-size: 14px;
				line-height: 1.45;
				font-weight: 600;
			}

			.spinner {
				width: 22px;
				height: 22px;
				margin: 6px auto 0;
				border-radius: 999px;
				border: 2px solid rgba(255, 255, 255, .16);
				border-top-color: #7dd3fc;
				animation: spin .8s linear infinite;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<main class="panel">
			<div class="mark" aria-hidden="true"></div>
			<h1>Opening secure room</h1>
			<p data-message>Preparing your MCast Studio invite.</p>
			<div class="spinner" aria-hidden="true"></div>
		</main>
		<script>
			(function () {
				"use strict";

				var message = document.querySelector("[data-message]");
				var params = new URLSearchParams(window.location.search || "");
				var code = params.get("s") || params.get("code") || readCodeFromPath(window.location.pathname || "");
				var target = new URL("/g/", window.location.origin);
				var targetParams = new URLSearchParams();

				params.forEach(function (value, key) {
					if (key !== "code") {
						targetParams.set(key, value);
					}
				});

				if (code && !targetParams.has("s") && !targetParams.has("t") && !targetParams.has("token")) {
					targetParams.set("s", code);
				}

				if (!targetParams.toString() && (window.location.search || "").length > 1) {
					target.search = window.location.search;
				} else if (targetParams.toString()) {
					target.search = "?" + targetParams.toString();
				} else {
					setMessage("This MCast Studio invitation link is not valid.");
					return;
				}

				window.location.replace(target.href + (window.location.hash || ""));

				function readCodeFromPath(pathname) {
					var match = pathname.match(/^\/(?:g|m|c|s|w|p|i)\/([A-Za-z0-9]{6,16})\/?$/i);
					return match ? match[1] : "";
				}

				function setMessage(value) {
					if (message) {
						message.textContent = value;
					}
				}
			})();
		</script>
	</body>
</html>
