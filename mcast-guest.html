<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<title>MCast Studio Guest Invite</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #060a10;
				color: #f4f7fb;
			}

			html,
			body {
				min-height: 100%;
				margin: 0;
				background: #060a10;
			}

			body {
				display: grid;
				place-items: center;
				padding: 24px;
				text-align: center;
			}

			.panel {
				display: grid;
				gap: 14px;
				width: min(420px, 100%);
			}

			.mark {
				width: 48px;
				height: 48px;
				margin: 0 auto;
				border-radius: 10px;
				background: #fff url("/media/mcast-apple-touch-icon.png") center / cover no-repeat;
			}

			h1 {
				margin: 0;
				font-size: 22px;
				line-height: 1.2;
				font-weight: 800;
				letter-spacing: 0;
			}

			p {
				margin: 0;
				color: #a8b3c4;
				font-size: 14px;
				line-height: 1.45;
				font-weight: 650;
			}

			.spinner {
				width: 22px;
				height: 22px;
				margin: 6px auto 0;
				border-radius: 999px;
				border: 2px solid rgba(255, 255, 255, .16);
				border-top-color: #7dd3fc;
				animation: spin .8s linear infinite;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<main class="panel">
			<div class="mark" aria-hidden="true"></div>
			<h1>Opening secure room</h1>
			<p data-message>Preparing your MCast Studio invite.</p>
			<div class="spinner" aria-hidden="true"></div>
		</main>
		<script>
			(function () {
				"use strict";

				var message = document.querySelector("[data-message]");
				var params = new URLSearchParams(window.location.search || "");
				var code = params.get("s") || params.get("code") || readCodeFromPath(window.location.pathname || "");

				if (code && !params.has("s") && !params.has("t") && !params.has("token")) {
					params.set("s", code);
				}

				fetch("/g/index.html" + (params.toString() ? "?" + params.toString() : "") + (window.location.hash || ""), {
					credentials: "same-origin",
					cache: "no-store"
				}).then(function (response) {
					if (!response.ok) {
						throw new Error("Guest shell failed to load");
					}
					return response.text();
				}).then(function (html) {
					var prepared = html.replace(/<base\s+href=["'][^"']*["']\s*>/i, '<base href="/">');
					document.open();
					document.write(prepared);
					document.close();
				}).catch(function () {
					setMessage("This MCast Studio invitation could not be opened. Refresh the page or request a new invite.");
				});

				function readCodeFromPath(pathname) {
					var match = pathname.match(/^\/(?:g|m|c|s|w|p|i|rv|ra|rs)\/([A-Za-z0-9]{6,32})\/?$/i);
					return match ? match[1] : "";
				}

				function setMessage(value) {
					if (message) {
						message.textContent = value;
					}
				}
			})();
		</script>
	</body>
</html>
